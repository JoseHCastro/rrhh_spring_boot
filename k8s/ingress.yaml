apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rrhh-backend-ingress
  annotations:
    kubernetes.io/ingress.class: "traefik"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    # Redirigir siempre HTTP a HTTPS
    traefik.ingress.kubernetes.io/router.middlewares: default-redirect-https@kubernetescrd
spec:
  tls:
    - hosts:
        - hr-springboot.duckdns.org
      secretName: hr-springboot-tls
  rules:
    - host: hr-springboot.duckdns.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: rrhh-backend-service
                port:
                  number: 80
